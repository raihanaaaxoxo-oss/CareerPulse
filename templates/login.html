{% extends "base.html"%}

{% block content %}

<h2>Login</h2>

{% if error %}
<p>{{ error}}</p>
{% endif %}

<form action="/login" method="POST">

    <label>Email</label><br>
    <input
        type="email"
        name="email"
        required
    ><br><br>

    <label>Password</label><br>
    <input
        type="password"
        name="password"
        required
    ><br><br>

    <button type="submit">Login</button>

</form>

<br>

<a href="/register">Don't have an account? Register</a>

{% endblock %}
