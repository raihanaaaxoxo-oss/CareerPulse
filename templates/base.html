<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CareerPulse{% endblock %}</title>
    <link rel="stylesheet"
          href="{{url_for('static', filename='css/main.css')}}">

</head>
<body>
    <div class="site-shell">
        <nav class="navbar">
            <div class="navbar-inner">
                <a href="/" class="brand">
                    <span class="brand-mark">✦</span>
                    <span>CareerPulse</span>
                </a>

                {% if session.get("user_id") %}

                <div class="nav-links">
                    <a href="/">Dashboard</a>
                    <a href="/applications">Applications</a>
                    <a href="/applications/new">Add Applications</a>
                    <a href="/logout" class="nav-logout">Logout</a>
                </div>

                {% endif %}
            </div>
        </nav>

        <main>
            <div class="container">

                {% block content %}{% endblock %}

            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                CareerPulse · Navigate your career trajectory.
            </div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='javascript/main.js') }}"></script>

</body>
</html>
