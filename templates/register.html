{% extends "base.html" %}

{% block title %}Register · CareerPulse{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="card auth-card">
        <div class="auth-brand">
            <div class="brand-mark">✦</div>
            <h1>Create your account</h1>
            <p>Start tracking your career trajectory.</p>
        </div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
            </div>

            <button type="submit" style="width: 100%;">Create Account</button>
        </form>

        <div class="auth-footer">Already have an account? 
            <a href="/login">Login</a> 
        </div>
    </div>
</div>

{% endblock %}
