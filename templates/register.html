{% extends "base.html" %}

{% block content %}

<h2>Create an Account</h2>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form action="/register" method="POST">

    <label>Email</label><br>
    <input
        type="email"
        name="email"
        required
    ><br><br>

    <label>Password</label><br>
    <input 
        type="password"
        name="password"
        required
    ><br><br>

    <button type="submit">Register</button>
</form>

<br>

<a href="/login">Already have an account? Login</a>

{% endblock %}
