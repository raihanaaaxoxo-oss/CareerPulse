{% extends "base.html" %}

{% block title %}Add Application · CareerPulse{% endblock %}

{% block content %}

<div class="page-header">
    <p class="eyebrow">Career Tracker</p>
    <h1>Add Application</h1>

<p>Record a new opportunity and start tracking its journey.</p>
</div>

<div class="card form-card wide">
    <form action="/applications/new" method="POST">
        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="e.g. Microsoft" required>
        </div>

        <div class="form-group">
            <label for="role_title">Role</label>
            <input type="text" id="role_title" name="role_title" placeholder="e.g. Junior Software Developer" required>
        </div>

        <div class="form-group">
            <label for="applied_date">Application Date</label>
            <input type="date" id="applied_date" name="applied_date" required>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="Applied">Applied</option>
                <option value="Screening">Screening</option>
                <option value="Interviewing">Interviewing</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit">Save Application</button>
            <a href="/applications" class="button button-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
