{% extends "base.html" %}

{% block content %}

<h2>Add Job Application</h2>

<form action="/applications/new" method="POST">
    <label>Company</label><br>
    <input 
        type="text"
        name="company"
        required
    ><br><br>

    <label>Role Title</label><br>
    <input 
        type="text"
        name="role_title"
        required
    ><br><br>

    <label>Application Date</label><br>
    <input 
        type="date"
        name="applied_date"
        required
    ><br><br>

    <button 
        type="submit">
            Submit
    </button>
</form>

<br>

<a href="/applications">Back to Applications</a>

{% endblock %}
